[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "npc-memory-project"
version = "0.4.0"
description = "Selective hierarchical memory for faithful explainable NPC decision-making"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = [
    "game-ai", "npc", "memory", "explainable-ai", "counterfactual",
    "belief-revision", "research-prototype",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "coverage>=7.0"]
game = ["pygame>=2.5"]

[project.scripts]
npc-memory-demo = "npc_memory_project.demo.shopkeeper_demo:main"
npc-memory-benchmark = "npc_memory_project.evaluation.benchmark:run_paper_benchmark"
npc-memory-simulator = "npc_memory_project.web.server:main"
npc-memory-game = "npc_memory_project.game.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
